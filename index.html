            max-width: 1100px; /* 再次大幅放大容器 */
            margin: 0 auto;
        }

        .fist-img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
        }

        .marker {
            position: absolute;
            width: 56px; /* 进一步增大按钮，适应 1100px 的大图 */
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            cursor: pointer;
            opacity: 0.85;
            transform: scale(1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            font-size: 1.4rem; /* 增大字体 */
            border: 3px solid white; /* 加粗白边 */
        }

        .marker:hover {
            transform: scale(1.1);
            opacity: 1;
        }

        .marker-big { background: #FF5600; } 
        .marker-small { background: #74706E; } 

        .marker-active {
            opacity: 1 !important;
            transform: scale(1.2) !important;
            box-shadow: 0 0 0 4px white, 0 8px 20px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .info-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            min-height: 180px;
        }

        .btn-next {
            background: #FF5600;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 86, 0, 0.3);
        }
        .btn-next:hover { transform: translateY(-2px); }
        .btn-next:active { transform: translateY(0); }

        .highlight { color: #FF5600; font-weight: bold; }

        @media (max-width: 640px) {
            .marker { width: 36px; height: 36px; font-size: 14px; }
        }
    &lt;/style&gt;

    &lt;!-- 儿歌页面弹窗 --&gt;
    &lt;div id=&quot;songOverlay&quot; class=&quot;fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4&quot;&gt;

                &lt;p class=&quot;flex items-center justify-center gap-4&quot;&gt;
                    &lt;span&gt;一三五七八十&lt;span class=&quot;cursor-pointer text-orange-500 underline decoration-2 underline-offset-4 hover:bg-orange-50 px-1 rounded relative&quot; onclick=&quot;event.stopPropagation(); toggleTip('laTip')&quot;&gt;腊
                        &lt;span id=&quot;laTip&quot; class=&quot;hidden absolute -top-12 left-1/2 -translate-x-1/2 bg-orange-600 text-white text-sm py-1 px-3 rounded-lg shadow-lg after:content-[''] after:absolute after:top-full after:left-1/2 after:-translate-x-1/2 after:border-8 after:border-transparent after:border-t-orange-600 z-10&quot;&gt;12月&lt;/span&gt;
                    &lt;/span&gt;&lt;/span&gt;，
                    &lt;span class=&quot;text-red-600 text-lg font-bold cursor-pointer hover:scale-105 transition-transform&quot; onclick=&quot;event.stopPropagation(); toggleTip('laTip')&quot;&gt;（腊：12月）&lt;/span&gt;
                &lt;/p&gt;
                &lt;p&gt;三十一天永不差，&lt;/p&gt;
                &lt;p class=&quot;flex items-center justify-center gap-4&quot;&gt;
                    &lt;span&gt;四六九&lt;span class=&quot;cursor-pointer text-orange-500 underline decoration-2 underline-offset-4 hover:bg-orange-50 px-1 rounded relative&quot; onclick=&quot;event.stopPropagation(); toggleTip('dongTip')&quot;&gt;冬
                        &lt;span id=&quot;dongTip&quot; class=&quot;hidden absolute -top-12 left-1/2 -translate-x-1/2 bg-orange-600 text-white text-sm py-1 px-3 rounded-lg shadow-lg after:content-[''] after:absolute after:top-full after:left-1/2 after:-translate-x-1/2 after:border-8 after:border-transparent after:border-t-orange-600 z-10&quot;&gt;11月&lt;/span&gt;
                    &lt;/span&gt;&lt;/span&gt;三十整，
                    &lt;span class=&quot;text-red-600 text-lg font-bold cursor-pointer hover:scale-105 transition-transform&quot; onclick=&quot;event.stopPropagation(); toggleTip('dongTip')&quot;&gt;（冬：11月）&lt;/span&gt;
                &lt;/p&gt;
                &lt;p&gt;平年二月二十八。&lt;/p&gt;
            &lt;/div&gt;
        &lt;/div&gt;

    &lt;script&gt;
        function showSongPage() {
            document.getElementById('songOverlay').classList.remove('hidden');
        }
        function hideSongPage() {
            document.getElementById('songOverlay').classList.add('hidden');
            document.getElementById('laTip').classList.add('hidden');
            document.getElementById('dongTip').classList.add('hidden');
        }
        function toggleTip(id) {
            const tip = document.getElementById(id);
            tip.classList.toggle('hidden');
        }
        
        const audioUrls = [
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/u8jmC5eStv5jnQCiNx9dVZ.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/2MC5m9CDcjMqoPbNHLLavJ.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/PmAVvqiDnqqo848vDnmWUU.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/8an3AgbgxUdz4QFA2Dniu8.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/5ckjZXoBZoNNNb2a9KBt2n.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/Q8MbpFrEA64ithmhMf7mGg.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/XkPEjyC3dptJmiAJVDSLNo.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/fEKyhecqzUpfTkcBVcbVF2.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/egUpnX2DH72SsXBWtK6rbV.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/zrXCaaShEqqAd7v3brbkQ6.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/XoBxEdFp7EJXvo66M84LTU.mp3&quot;,
            &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/wZ4RYdGydBNoB7ywCQVLme.mp3&quot;
        ];

        const data = [
            { m: '一月', type: '凸', days: 31, info: '一月大，食指关节凸起。' },
            { m: '二月', type: '凹', days: '28/29', info: '二月平。' },
            { m: '三月', type: '凸', days: 31, info: '三月大，中指关节凸起。' },
            { m: '四月', type: '凹', days: 30, info: '四月小，第二处凹陷。' },
            { m: '五月', type: '凸', days: 31, info: '五月大，无名指关节凸起。' },
            { m: '六月', type: '凹', days: 30, info: '六月小，第三处凹陷。' },
            { m: '七月', type: '凸', days: 31, info: '七月大，小指关节凸起。' },
            { m: '八月', type: '凸', days: 31, info: '八月大，跳回食指位置。' },
            { m: '九月', type: '凹', days: 30, info: '九月小，对应凹陷处。' },
            { m: '十月', type: '凸', days: 31, info: '十月大，对应中指凸起。' },
            { m: '十一月', type: '凹', days: 30, info: '十一月小，对应凹陷处。' },
            { m: '十二月', type: '凸', days: 31, info: '十二月大，对应无名指凸起。' }
        ];

        let step = -1;
        const markers = document.querySelectorAll('.marker');
        const monthTitle = document.getElementById('monthTitle');
        const monthDesc = document.getElementById('monthDesc');
        const dayTag = document.getElementById('dayTag');
        let currentAudio = null;

        function playVoice(idx) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(audioUrls[idx]);
            currentAudio.play();
        }

        function update(idx) {
            step = idx;
            markers.forEach(m =&gt; m.classList.remove('marker-active'));
            
            if (idx === -1) {
                monthTitle.innerText = &quot;准备开始&quot;;
                monthDesc.innerHTML = '伸出你的&lt;span class=&quot;highlight&quot;&gt;左手&lt;/span&gt;，握紧拳头，&lt;span class=&quot;highlight&quot;&gt;手背朝上&lt;/span&gt;。点击拳头上的数字开始学习。';
                dayTag.classList.add('hidden');
                return;
            }

            const item = data[idx];
            const activeMarker = markers[idx];
            activeMarker.classList.add('marker-active');

            monthTitle.innerText = item.m;
            monthDesc.innerText = item.info;
            dayTag.innerText = `${item.days} 天`;
            dayTag.classList.remove('hidden');

            if (item.type === '凸') {
                dayTag.className = &quot;mt-4 inline-block px-5 py-1 rounded-full font-bold text-lg bg-orange-100 text-orange-600&quot;;
            } else {
                dayTag.className = &quot;mt-4 inline-block px-5 py-1 rounded-full font-bold text-lg bg-gray-100 text-gray-600&quot;;
            }

            playVoice(idx);

            anime({
                targets: '#contentBox',
                translateX: [15, 0],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
        }

        document.getElementById('resetBtn').onclick = () =&gt; {
            step = -1; update(-1);
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
        };

        anime({
            targets: '.marker',
            scale: [0, 1],
            opacity: [0, 0.8],
            delay: anime.stagger(100, {start: 500}),
            duration: 800,
            easing: 'easeOutElastic(1, .6)'
        });

        anime({
            targets: '.fist-img',
            scale: [0.95, 1],
            opacity: [0, 1],
            duration: 800,
            easing: 'easeOutQuad'
        });
    &lt;/script&gt;

<script>

    function getIsMobile() {
        const width = document.documentElement.clientWidth
        const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
        return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
        const isMobile = getIsMobile()

        // 判断是否为移动端浏览器
        if (isMobile) {
            // 移动端不跳转
            return
        }
        window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
        let startTime = null
        let totalTime = 0
        let reportTimer = null // 防抖定时器

        // 开始计时
        function startTimer() {
            if (!startTime) {
                startTime = Date.now()
                console.log('[埋点] 开始计时')
            }
        }

        // 停止计时并累加时长
        function stopTimer() {
            if (startTime) {
                totalTime += Date.now() - startTime
                startTime = null
                console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
            }
        }

        // 检查页面是否真正可见
        function isPageVisible() {
            // 检查 document.hidden
            if (document.hidden) {
                return false
            }

            // 检查 document.visibilityState
            if (document.visibilityState && document.visibilityState !== 'visible') {
                return false
            }

            // 检查窗口是否有焦点
            if (!document.hasFocus()) {
                return false
            }

            return true
        }

        // 上报停留时长（带防抖）
        function reportStayTime(eventType, immediate = false) {
            stopTimer()

            // 清除之前的定时器
            if (reportTimer) {
                clearTimeout(reportTimer)
                reportTimer = null
            }

            // 如果是立即上报（如页面卸载），不使用防抖
            if (immediate) {
                doReport(eventType)
                return
            }

            // 使用防抖，避免短时间内多次上报
            // 100ms 内如果有多个事件触发，只上报最后一次
            reportTimer = setTimeout(function () {
                doReport(eventType)
                reportTimer = null
            }, 100)
        }

        // 实际执行上报
        function doReport(eventType) {
            if (window.frog && totalTime > 0) {
                const serverData = window.__SERVER_DATA__ || {}
                const chatId = serverData.watermarkChatId
                window.frog.add({
                    url: '/time/HtmlPage/enter',
                    eventId: 42818,
                    customExtend: {
                        chat_id: chatId,
                        use_time: Math.floor(totalTime / 1000), // 转换为秒
                    },
                    duration: Math.floor(totalTime / 1000), // 转换为秒,
                    currentPage: 'HtmlPage',
                    eventAction: 'time',
                    eventName: 'enter'
                })
                console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

                // 上报后重置累计时长，为下次统计做准备
                totalTime = 0
            }
        }

        // 清理函数：移除所有事件监听器
        function cleanup() {
            console.log('[埋点] 清理计时器资源')

            // 清除防抖定时器
            if (reportTimer) {
                clearTimeout(reportTimer)
                reportTimer = null
            }

            // 移除事件监听器
            document.removeEventListener('visibilitychange', handleVisibilityChange)
            window.removeEventListener('blur', handleBlur)
            window.removeEventListener('focus', handleFocus)
            window.removeEventListener('beforeunload', handleBeforeUnload)
            window.removeEventListener('pagehide', handlePageHide)

            // 重置变量
            startTime = null
            totalTime = 0
        }

        // 事件处理函数（需要命名以便移除）
        function handleVisibilityChange() {
            if (document.hidden) {
                // 页面不可见，停止计时并上报
                console.log('[埋点] visibilitychange - 页面隐藏')
                reportStayTime('visibilitychange')
            } else {
                // 页面可见，开始新的计时
                console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
                startTimer()
            }
        }

        function handleBlur() {
            // 窗口失去焦点，停止计时并上报
            console.log('[埋点] blur - 窗口失去焦点')
            reportStayTime('blur')
        }

        function handleFocus() {
            // 窗口获得焦点，开始新的计时
            console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
            startTimer()
        }

        function handleBeforeUnload() {
            // 页面卸载前立即上报（不使用防抖）
            console.log('[埋点] beforeunload - 页面即将卸载')
            reportStayTime('beforeunload', true)
            cleanup()
        }

        function handlePageHide() {
            // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
            console.log('[埋点] pagehide - 页面隐藏')
            reportStayTime('pagehide', true)
        }

        function handleDOMContentLoaded() {
            if (isPageVisible()) {
                startTimer()
            }
        }

        // 监听页面可见性变化
        document.addEventListener('visibilitychange', handleVisibilityChange)

        // 监听窗口失去/获得焦点
        window.addEventListener('blur', handleBlur)
        window.addEventListener('focus', handleFocus)

        // 页面加载完成后开始计时
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
        } else {
            if (isPageVisible()) {
                startTimer()
            }
        }

        // 页面卸载时上报
        window.addEventListener('beforeunload', handleBeforeUnload)

        // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
        window.addEventListener('pagehide', handlePageHide)
    })()

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
        // 绑定 Logo 点击埋点和跳转功能
        const logoElement = document.querySelector('.left-watermark-content')
        if (logoElement) {
            logoElement.addEventListener('click', function (event) {
                trackLogoClick(event)
                openFeixiangTeacher(event)
            })
        }

        // 绑定立即体验按钮点击埋点和跳转功能
        const startButton = document.querySelector('.jump-button')
        if (startButton) {
            startButton.addEventListener('click', function (event) {
                trackStartButtonClick(event)
                openFeixiangTeacher(event)
            })
        }

        // 绑定水印覆盖层点击（整体区域）
        const watermarkOverlay = document.querySelector('.watermark-overlay')
        if (watermarkOverlay) {
            watermarkOverlay.addEventListener('click', function (event) {
                // 如果点击的不是 logo 或按钮，则触发跳转
                const target = event.target
                const isLogo = target.closest('.left-watermark-content')
                const isButton = target.closest('.jump-button')

                if (!isLogo && !isButton) {
                    openFeixiangTeacher(event)
                }
            })
        }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
        const pcBaseWidth = 375 // 设计稿
        const width = document.documentElement.clientWidth
        document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
        const isMobile = getIsMobile()
        if (isMobile) {
            adjustRem()
        }
        const jumpButton = document.querySelector('.right-watermark-content .jump-button');
        const iframeContainer = document.querySelector('.iframe-container');

        if (isMobile && jumpButton) {
            jumpButton.style.display = 'none';
        } else {
            jumpButton.style.display = 'flex'
        }

        // 移动端时给iframe-container添加类名，否则移除类名
        if (iframeContainer) {
            if (isMobile) {
                iframeContainer.classList.add('mobile');
            } else {
                iframeContainer.classList.remove('mobile');
            }
        }
    }


    function handleResize() {
        // 响应式处理：重新检测移动端并处理按钮显示/隐藏
        checkAndHideButtonOnMobile();

        // 在窗口大小变化时，重新应用移动端相关的逻辑
        const isMobile = getIsMobile()
        const watermarkOverlay = document.querySelector('.watermark-overlay');
        const iframeContainer = document.querySelector('.iframe-container');

        // 根据当前设备类型调整水印覆盖层的点击行为
        if (watermarkOverlay) {
            if (isMobile) {
                // 移动端：移除点击事件或设置为空函数
                watermarkOverlay.onclick = function () {
                    // 移动端不执行跳转
                    return;
                };
            } else {
                // 桌面端：恢复正常的点击跳转功能
                watermarkOverlay.onclick = openFeixiangTeacher;
            }
        }

        // 确保在resize时也能正确添加或移除mobile类
        if (iframeContainer) {
            if (isMobile) {
                iframeContainer.classList.add('mobile');
            } else {
                iframeContainer.classList.remove('mobile');
            }
        }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
        // 清除 resize 事件监听器
        window.removeEventListener('resize', handleResize);

        // 清除 DOMContentLoaded 事件监听器
        document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);
